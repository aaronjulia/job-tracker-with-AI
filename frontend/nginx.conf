server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # gzip the text assets; images and fonts are already compressed.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # Vite fingerprints everything under /assets, so it can be cached forever.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # Client-side routing: unknown paths are React Router's problem, not nginx's.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached, or clients get pinned to a stale bundle.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
